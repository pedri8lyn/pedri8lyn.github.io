name: Mise à jour des vidéos TikTok

on:
  schedule:
    - cron: "17 */4 * * *"   # toutes les 4 heures
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U "yt-dlp[default,curl-cffi]"
      - run: python scripts/update_tiktok.py
      - name: Commit si nouvelles vidéos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/covers
          git diff --cached --quiet || (git commit -m "Mise à jour des vidéos TikTok" && git push)
